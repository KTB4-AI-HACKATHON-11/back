plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.ktb'
version = '0.0.1-SNAPSHOT'

// OneDrive의 Files On-Demand가 build/classes를 reparse point로 바꾸면
// Gradle이 이전 컴파일 산출물을 삭제하거나 스냅샷하지 못한다.
// 명시적인 GRADLE_BUILD_DIR을 우선 사용하고, OneDrive 작업공간에서만
// 재생성 가능한 빌드 산출물을 LOCALAPPDATA 아래로 우회한다.
def configuredBuildDir = System.getenv('GRADLE_BUILD_DIR')
def localAppData = System.getenv('LOCALAPPDATA')
def isOneDriveWorkspace = projectDir.absolutePath.toLowerCase(Locale.ROOT)
		.contains("${File.separator}onedrive${File.separator}".toLowerCase(Locale.ROOT))

if (configuredBuildDir) {
	layout.buildDirectory = file(configuredBuildDir)
} else if (isOneDriveWorkspace && localAppData) {
	layout.buildDirectory = file("${localAppData}/ktb11-build/${rootProject.name}")
}

java {
	sourceCompatibility = '21'
	targetCompatibility = '21'
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'nl.martijndwars:web-push:5.1.2'
	implementation 'org.apache.httpcomponents:httpcore:4.4.16'
	implementation 'org.bitbucket.b_c:jose4j:0.7.9'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
	implementation platform('software.amazon.awssdk:bom:2.32.18')
	implementation 'software.amazon.awssdk:s3'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'

	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}
