name: Expose AI Console

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expose-ai-console.yml'

concurrency:
  group: ai-console-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$APP_HOST" >> ~/.ssh/known_hosts

      - name: Publish password-protected AI console
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key ubuntu@"$APP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          DOMAIN='flowcheck.yohan.me.kr'
          SITE='/etc/nginx/sites-available/flowcheck-ai-console'
          ENABLED='/etc/nginx/sites-enabled/flowcheck-ai-console'
          ACME_ROOT='/var/www/flowcheck-certbot'

          sudo install -d -m 0755 "$ACME_ROOT/.well-known/acme-challenge"
          printf '%s\n' 'flowcheck:$2a$14$9y54I.9xDVytCP6EppkTeOZ5DQ77bx4Bz4x0DzA4p8ep6dsJ2OT/a' \
            | sudo tee /etc/nginx/.htpasswd-flowcheck-ai-console >/dev/null
          sudo chown root:www-data /etc/nginx/.htpasswd-flowcheck-ai-console
          sudo chmod 0640 /etc/nginx/.htpasswd-flowcheck-ai-console

          if [[ -f "$SITE" && ! -f "${SITE}.before-codex" ]]; then
            sudo cp -p "$SITE" "${SITE}.before-codex"
          fi

          sudo tee "$SITE" >/dev/null <<NGINX
          server {
              listen 80;
              listen [::]:80;
              server_name ${DOMAIN};

              location ^~ /.well-known/acme-challenge/ {
                  root ${ACME_ROOT};
              }

              location / {
                  return 503;
              }
          }
          NGINX
          sudo ln -sfn "$SITE" "$ENABLED"
          sudo nginx -t
          sudo systemctl reload nginx

          if ! command -v certbot >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq certbot
          fi

          if [[ ! -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]]; then
            sudo certbot certonly \
              --webroot \
              --webroot-path "$ACME_ROOT" \
              --domain "$DOMAIN" \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email
          fi

          sudo tee "$SITE" >/dev/null <<NGINX
          server {
              listen 80;
              listen [::]:80;
              server_name ${DOMAIN};

              location ^~ /.well-known/acme-challenge/ {
                  root ${ACME_ROOT};
              }

              location / {
                  return 308 https://\$host\$request_uri;
              }
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              http2 on;
              server_name ${DOMAIN};

              ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_session_cache shared:FlowCheckTLS:10m;
              ssl_session_timeout 1d;

              client_max_body_size 20m;

              location / {
                  auth_basic "FlowCheck AI Console";
                  auth_basic_user_file /etc/nginx/.htpasswd-flowcheck-ai-console;

                  proxy_pass https://flowcheck-ai.yohan.me.kr:8890/console/;
                  proxy_http_version 1.1;
                  proxy_ssl_server_name on;
                  proxy_ssl_name flowcheck-ai.yohan.me.kr;
                  proxy_set_header Host flowcheck-ai.yohan.me.kr:8890;
                  proxy_set_header Authorization "";
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_read_timeout 120s;
                  proxy_send_timeout 120s;
              }
          }
          NGINX

          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE

      - name: Verify public access
        env:
          AI_CONSOLE_DEMO_PASSWORD: ${{ secrets.AI_CONSOLE_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AI_CONSOLE_DEMO_PASSWORD"
          curl --fail --silent --show-error --max-time 15 \
            --user "flowcheck:${AI_CONSOLE_DEMO_PASSWORD}" \
            --output /dev/null \
            https://flowcheck.yohan.me.kr/
