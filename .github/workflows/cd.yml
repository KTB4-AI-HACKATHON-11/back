name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-hackathon-11-back"
          SOURCE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          TAG="${SOURCE_SHA::12}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build application
        run: ./gradlew bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-26.04

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$APP_HOST" >> ~/.ssh/known_hosts

      - name: Login to GHCR on App EC2
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/deploy_key ubuntu@"$APP_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy backend
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AI_BACKEND_BASE_URL: ${{ secrets.AI_BACKEND_BASE_URL }}
          AI_SERVICE_TOKEN: ${{ secrets.AI_SERVICE_TOKEN }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key ubuntu@"$APP_HOST" \
            "IMAGE_REF='$IMAGE_REF' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_NAME='$DB_NAME' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' AWS_REGION='$AWS_REGION' S3_BUCKET='$S3_BUCKET' AWS_ACCESS_KEY_ID='$AWS_ACCESS_KEY_ID' AWS_SECRET_ACCESS_KEY='$AWS_SECRET_ACCESS_KEY' AI_BACKEND_BASE_URL='$AI_BACKEND_BASE_URL' AI_SERVICE_TOKEN='$AI_SERVICE_TOKEN' WEB_PUSH_VAPID_PUBLIC_KEY='$WEB_PUSH_VAPID_PUBLIC_KEY' WEB_PUSH_VAPID_PRIVATE_KEY='$WEB_PUSH_VAPID_PRIVATE_KEY' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p ~/hackathon/backend

          docker network inspect hackathon-net >/dev/null 2>&1 || docker network create hackathon-net
          docker pull "$IMAGE_REF"
          docker rm -f backend 2>/dev/null || true

          AWS_DOCKER_ARGS=()
          if [[ -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            AWS_DOCKER_ARGS+=(
              -e "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
              -e "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            )
          fi

          docker run -d \
            --name backend \
            --restart unless-stopped \
            --network hackathon-net \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL="jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8" \
            -e DB_USERNAME="${DB_USERNAME}" \
            -e DB_PASSWORD="${DB_PASSWORD}" \
            -e AWS_REGION="${AWS_REGION}" \
            -e S3_BUCKET="${S3_BUCKET}" \
            "${AWS_DOCKER_ARGS[@]}" \
            -e AI_BACKEND_BASE_URL="${AI_BACKEND_BASE_URL}" \
            -e AI_SERVICE_TOKEN="${AI_SERVICE_TOKEN}" \
            -e WEB_PUSH_ENABLED=true \
            -e WEB_PUSH_VAPID_PUBLIC_KEY="${WEB_PUSH_VAPID_PUBLIC_KEY}" \
            -e WEB_PUSH_VAPID_PRIVATE_KEY="${WEB_PUSH_VAPID_PRIVATE_KEY}" \
            -e WEB_PUSH_VAPID_SUBJECT="https://checkon.cloud" \
            "$IMAGE_REF"

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/v3/api-docs >/dev/null; then
              exit 0
            fi
            sleep 3
          done

          docker logs --tail 200 backend
          exit 1
          REMOTE
