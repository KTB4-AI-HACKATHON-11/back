spring:
  application:
    name: ai-hackathon-11
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 200MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_hackathon_11?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ktb_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

logging:
  level:
    org.hibernate.SQL: debug

ai:
  base-url: ${AI_BACKEND_BASE_URL:}
  service-token: ${AI_SERVICE_TOKEN:}
  connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:60}
  stub-enabled: ${AI_STUB_ENABLED:false}

storage:
  local-enabled: ${STORAGE_LOCAL_ENABLED:false}
  bucket: ${S3_BUCKET:moamoa11}
  region: ${AWS_REGION:ap-southeast-2}
  presigned-url-minutes: ${S3_PRESIGNED_URL_MINUTES:5}

task:
  assignment-generation-cron: ${TASK_ASSIGNMENT_GENERATION_CRON:0 0 0 * * *}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET:}
