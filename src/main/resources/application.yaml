spring:
  application:
    name: ai-hackathon-11
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_hackathon_11?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ktb_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

logging:
  level:
    org.hibernate.SQL: debug

ai:
  base-url: ${AI_BASE_URL:http://localhost:8081}
  service-token: ${AI_SERVICE_TOKEN:demo-token}
  connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:60}
  stub-enabled: ${AI_STUB_ENABLED:true}

storage:
  local-enabled: ${STORAGE_LOCAL_ENABLED:true}
  bucket: ${S3_BUCKET:convenience-store-task-agent}
  region: ${AWS_REGION:ap-northeast-2}
  presigned-url-minutes: ${S3_PRESIGNED_URL_MINUTES:5}

task:
  assignment-generation-cron: ${TASK_ASSIGNMENT_GENERATION_CRON:0 0 0 * * *}

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET:}
