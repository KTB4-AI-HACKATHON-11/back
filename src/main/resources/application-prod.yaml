server:
  forward-headers-strategy: framework

cors:
  allowed-origin-patterns: https://checkon.cloud,http://localhost:5173,http://127.0.0.1:5173

openapi:
  server-url: https://api.checkon.cloud

spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: info
