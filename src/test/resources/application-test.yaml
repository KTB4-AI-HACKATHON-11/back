spring:
  datasource:
    url: jdbc:h2:mem:checkon;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

cors:
  allowed-origin-patterns: http://localhost:*

ai:
  stub-enabled: true

storage:
  local-enabled: true

web-push:
  enabled: false
